name: Build Windows ARM64

# 用法（fork 后）：
#   把本文件放到 .github/workflows/build-win-arm64.yml（覆盖 Artifact 版同名文件）
#   然后到 Actions -> Build Windows ARM64 -> Run workflow 手动触发
#   打包完成后会自动创建一个 Release，并把安装包挂上去，可直链下载。
# 原理：
#   上游 apps/electron/build.ts 的 win 分支写死了 Arch.x64，
#   本 workflow 只在 CI 里临时把那一行改成 Arch.arm64，不改仓库源码。
# 注意：
#   Release 的 tag 故意用 arm64- 开头，不用 v 开头，
#   否则会误触发上游 release.yml 的 v* 规则（它还会去打 Android 且需要签名密钥）。

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner（ARM 原生优先，排不到队/私有仓库改用 windows-latest 交叉打包）"
        type: choice
        options:
          - windows-11-arm
          - windows-latest
        default: windows-11-arm
        required: true
      tag:
        description: "Release tag（留空自动生成 arm64-v<版本>-<日期>-<序号>）"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: ${{ inputs.runner }}
    env:
      NONAME_BUILD_CHANNEL: test
      NONAME_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch build.ts to ARM64 (CI only)
        shell: pwsh
        run: |
          $path = "apps/electron/build.ts"
          $content = Get-Content $path -Raw
          $old = 'Platform.WINDOWS.createTarget("nsis", Arch.x64)'
          $new = 'Platform.WINDOWS.createTarget("nsis", Arch.arm64)'
          if (-not $content.Contains($old)) {
            throw "Patch target not found in build.ts, upstream may have changed. Aborting."
          }
          $content.Replace($old, $new) | Set-Content $path -NoNewline
          Write-Host "Patched:"
          Select-String -Path $path -Pattern "WINDOWS.createTarget"

      - name: Build Windows ARM64 installer
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release
          pnpm build
          pnpm -F @noname/electron build:win

          echo "=== output/ ==="
          ls -lah output/

          # electron-builder 打 ARM64 时解包目录应为 win-arm64-unpacked
          if [ ! -d "output/win-arm64-unpacked" ]; then
            echo "::error::output/win-arm64-unpacked not found - not an ARM64 build!"
            ls -R output || true
            exit 1
          fi

          VER="$(node -p "require('./apps/electron/package.json').version")"
          echo "VER=$VER" >> "$GITHUB_ENV"

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="arm64-v${VER}-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release tag: $TAG"

          EXE="$(find output -maxdepth 1 -name '*.exe' | head -n 1)"
          echo "Found installer: $EXE"
          cp "$EXE" "release/noname.Setup.${VER}-arm64.exe"
          cd release
          sha256sum "noname.Setup.${VER}-arm64.exe" > "noname.Setup.${VER}-arm64.exe.sha256"
          ls -lah

      - name: Upload ARM64 installer (Artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: noname-windows-arm64-${{ env.VER }}
          path: |
            release/noname.Setup.*-arm64.exe
            release/noname.Setup.*-arm64.exe.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Windows ARM64 (NSIS) build of noname ${VER}, based on commit ${GITHUB_SHA}. For Windows on ARM devices (e.g. Snapdragon). Unofficial build from fork workflow."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading with --clobber"
            gh release upload "$TAG" \
              "release/noname.Setup.${VER}-arm64.exe" \
              "release/noname.Setup.${VER}-arm64.exe.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "release/noname.Setup.${VER}-arm64.exe" \
              "release/noname.Setup.${VER}-arm64.exe.sha256" \
              --title "noname ${VER} - Windows ARM64" \
              --notes "$NOTES" \
              --latest=false
          fi

          echo "Release published: $TAG"
